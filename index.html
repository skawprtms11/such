<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2d4a">
<title>더퓨어랩 수출 모니터링 시스템 - 로그인</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="login-body">
<main class="login">
  <div class="login__brand">
    <img src="icons/icon.svg" alt="" width="56" height="56">
    <h1>더퓨어랩<br><span>수출 모니터링 시스템</span></h1>
    <p class="login__desc">주문 등록부터 상차 확인까지 실시간으로 관리합니다.</p>
  </div>

  <form class="login__form" id="login-form">
    <div id="login-fields"></div>
    <label class="check">
      <input type="checkbox" id="keep-login"> 로그인 상태 유지
    </label>
    <button class="btn btn--primary btn--block" type="submit">로그인</button>
    <p class="login__note" id="login-note"></p>
  </form>
</main>

<script type="module">
import { listUsers } from './assets/js/db.js';
import { signIn, currentUser, roleLabel } from './assets/js/auth.js';
import { isSupabase } from './assets/js/store.js';
import { esc, toast } from './assets/js/util.js';
import { shellUrl, applyShellQuery } from './assets/js/shell.js';

// ?shell=web|app 탈출구를 먼저 반영한다 (아래 분기가 이 값을 본다)
applyShellQuery();

// 이미 로그인되어 있으면 이 기기·소속이 쓸 셸로 바로 보낸다
const logged = currentUser();
if (logged) location.replace(shellUrl(logged));

const fields = document.getElementById('login-fields');
const note = document.getElementById('login-note');

if (isSupabase) {
    // Supabase Auth - 이메일 + 비밀번호
    fields.innerHTML = `
    <label class="field">
      <span class="field__label">이메일</span>
      <input type="email" id="login-email" autocomplete="username" required
             placeholder="name@thepurelab.co.kr">
    </label>
    <label class="field" style="margin-top:10px">
      <span class="field__label">비밀번호</span>
      <input type="password" id="login-pw" autocomplete="current-password" required>
    </label>`;
    note.innerHTML = '비밀번호를 잊었으면 관리자에게 문의하세요.';
} else {
    // 임시 로그인 - 계정 목록에서 고른다
    fields.innerHTML = `
    <label class="field">
      <span class="field__label">사용자 선택</span>
      <select id="user-select" required></select>
    </label>`;
    const users = await listUsers();
    document.getElementById('user-select').innerHTML = users
        .map((u) => `<option value="${u.id}">${esc(u.name)} (${esc(roleLabel(u.role))}) - ${esc(u.company)}</option>`)
        .join('');
    note.innerHTML = '서버(Supabase) 연동 전 임시 로그인 화면입니다.<br>'
        + '계정을 선택하면 해당 권한으로 시스템을 사용할 수 있습니다.';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const keepLogin = document.getElementById('keep-login').checked;
    try {
        const user = await signIn(isSupabase
            ? {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-pw').value,
                keepLogin,
            }
            : { userId: document.getElementById('user-select').value, keepLogin });
        location.href = shellUrl(user);
    } catch (err) {
        toast(err.message, 'error');
    }
});
</script>
</body>
</html>
