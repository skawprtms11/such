<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2d4a">
<title>더퓨어랩 수출 모니터링 시스템</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body class="m-body">

<div class="m-app">
  <header class="m-top">
    <button class="m-top__btn" id="m-back" type="button" aria-label="뒤로" hidden></button>
    <h1 class="m-top__title" id="m-title"></h1>
    <button class="m-top__btn" id="m-menu-btn" type="button"
            aria-label="메뉴" aria-expanded="false" aria-controls="m-drawer"></button>
  </header>

  <main class="m-view" id="view"></main>

  <nav class="m-tabbar" id="m-tabbar" aria-label="주요 작업"></nav>
</div>

<div class="m-drawer" id="m-drawer" hidden>
  <button class="m-drawer__dim" id="m-drawer-dim" type="button" aria-label="메뉴 닫기"></button>
  <div class="m-drawer__panel">
    <div class="m-me" id="m-drawer-me"></div>
    <nav class="m-drawer__nav" id="m-drawer-nav"></nav>
    <button class="m-drawer__item m-drawer__item--foot" id="m-logout" type="button"></button>
  </div>
</div>

<script type="module" src="assets/js/mobile/app.js"></script>
</body>
</html>
