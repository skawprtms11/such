# Netlify 배포 설정 (유일한 배포처)
# 대시보드 설정보다 이 파일이 우선한다. 빌드 방법을 코드로 남겨 재현 가능하게 한다.

[build]
  # 검사까지 여기서 돌린다. lint 가 실패하면 배포되지 않는다
  command = "npm run lint && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Supabase 접속 설정(VITE_*)은 Netlify 사이트 환경변수에 있다.
# 키를 이 파일에 넣지 않는다. (.env.example 참고)

# 보안 헤더. 정적 파일이라 서버 코드 없이 여기서 지정한다.
[[headers]]
  for = "/*"
  [headers.values]
    # 화면을 innerHTML 로 그리므로 CSP 가 XSS 의 마지막 방어선이다.
    # Supabase(REST·Realtime), Google Fonts 만 허용한다.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://atshpmifefrsfzjmjsbj.supabase.co wss://atshpmifefrsfzjmjsbj.supabase.co; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
