<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테스트용 바코드 - 더퓨어랩 수출 모니터링 시스템</title>
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  body { background: #fff; padding: 24px; }
  .sheet { max-width: 900px; margin: 0 auto; }
  .sheet h1 { font-size: 20px; margin-bottom: 6px; }
  .sheet__desc { color: var(--gray-500); font-size: 13px; margin: 0 0 20px; line-height: 1.7; }
  .bc-group { margin-bottom: 26px; }
  .bc-group h2 { font-size: 15px; margin-bottom: 10px; }
  .bc-list { display: flex; flex-wrap: wrap; gap: 14px; }
  .bc {
    border: 1px solid var(--gray-200);
    border-radius: 10px;
    padding: 10px 12px 6px;
    text-align: center;
    background: #fff;
  }
  .bc__cap { font-size: 11px; color: var(--gray-500); margin-bottom: 4px; }
  /* 인식 테스트 카드 - 규격·거리·조도를 바꿔 가며 어디서부터 안 읽히는지 본다 */
  .bc--test { border-color: var(--gray-400); }
  .bc__scale { overflow: hidden; margin: 0 auto; }
  .bc__dim { position: relative; }
  /* 저조도 - 회색을 덮어 대비를 떨어뜨린다 (어두운 창고를 흉내낸다) */
  .bc__dim::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #808080;
    opacity: .45;
  }
  @media print {
    .no-print { display: none; }
    body { padding: 0; }
    .bc { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="sheet">
  <h1>테스트용 바코드</h1>
  <p class="sheet__desc">
    출고주문처리(주문번호)와 검수(파렛트 바코드) 화면 테스트에 쓰는 Code128 바코드입니다.<br>
    맨 위 <b>인식 테스트 카드</b>는 규격·거리·조도를 바꿔 가며 인식 한계를 재는 용도입니다.<br>
    화면에 띄운 뒤 휴대폰으로 스캔하거나, 인쇄해서 사용하세요.
    현재 저장된 샘플 데이터 기준으로 생성됩니다.
  </p>
  <div class="btn-row no-print" style="margin-bottom:20px">
    <button class="btn" onclick="window.print()" type="button">인쇄</button>
    <a class="btn" href="app.html">시스템으로 돌아가기</a>
  </div>
  <div id="out"></div>
</div>

<script type="module">
import { code128Svg } from './assets/js/barcode.js';
import * as db from './assets/js/db.js';
import { esc } from './assets/js/util.js';

const out = document.getElementById('out');

/** 바코드 카드 1개 */
const card = (code, caption) => `
<div class="bc">
  <div class="bc__cap">${esc(caption)}</div>
  ${code128Svg(code, { height: 60, moduleWidth: 2 })}
</div>`;

/** 원거리 모사 - 표준 카드를 그대로 축소한다 (모듈 픽셀이 줄어드는 상황이 핵심이다) */
function scaled(svg, s) {
    // 모듈 굵기가 소수면 치수도 소수라 `\d+` 로는 못 잡는다
    const w = Number(svg.match(/width="([\d.]+)"/)[1]);
    const h = Number(svg.match(/height="([\d.]+)"/)[1]);
    return `<div class="bc__scale" style="width:${Math.round(w * s)}px;height:${Math.round(h * s)}px">
  <div style="transform:scale(${s});transform-origin:0 0;width:${w}px;height:${h}px">${svg}</div>
</div>`;
}

/** 인식 테스트 카드 1개 */
const testCard = (caption, body) => `
<div class="bc bc--test">
  <div class="bc__cap">${esc(caption)}</div>
  ${body}
</div>`;

const TEST_CODE = 'SCAN-TEST-01';
const std = code128Svg(TEST_CODE, { height: 60, moduleWidth: 2 });
const testGroup = `
<div class="bc-group">
  <h2>인식 테스트 카드 <span class="tag tag--gray">${esc(TEST_CODE)}</span></h2>
  <p class="sheet__desc" style="margin-bottom:10px">
    카메라 인식 강화(줌·해상도·ROI)를 확인할 때 씁니다. 화면에 띄워 두고
    <b>어느 카드부터 안 읽히는지</b>를 봅니다 — 안 읽히는 카드가 그 기기·거리의 한계입니다.
    바코드는 <b>가장 가는 바가 이미지에서 2px 이상</b>이어야 읽힙니다.
    (판정 기준·조정 방법은 <a href="docs/testing.md">docs/testing.md</a>)
  </p>
  <div class="bc-list">
    ${testCard('표준 (모듈 2px · 높이 60)', std)}
    ${testCard('소형 (모듈 1px · 높이 20)', code128Svg(TEST_CODE, { height: 20, moduleWidth: 1 }))}
    ${testCard('원거리 3m 모사 (표준 ×0.35)', scaled(std, 0.35))}
    ${testCard('초원거리 6~8m 모사 (표준 ×0.18)', scaled(std, 0.18))}
    ${testCard('저조도 (표준 + 회색 45%)', `<div class="bc__dim">${std}</div>`)}
    ${testCard('권장 규격 (모듈 3px · 높이 70 = 기본값)', code128Svg(TEST_CODE))}
  </div>
</div>`;

const orders = await db.listOrders({});
const active = orders.filter((o) => !o.canceled_at);

const groups = [testGroup, `
<div class="bc-group">
  <h2>주문번호 <span class="tag tag--gray">${active.length}건</span></h2>
  <p class="sheet__desc" style="margin-bottom:10px">
    출고주문처리의 출고작업 · 검수작업 · 조정요청 탭에서 스캔합니다.
    <b>상차리스트 → 검수 화면</b>에서도 같은 바코드를 파렛트마다 한 번씩 스캔합니다
    (주문처리현황에서 출력하는 상차라벨에 인쇄되는 바코드와 같습니다).
  </p>
  <div class="bc-list">
    ${active.map((o) => card(o.order_no, `${o.customer} · ${o.seq}차수`)).join('')}
  </div>
</div>`];

for (const o of active) {
    const pallets = await db.listPallets(o.id);
    if (!pallets.length) continue;
    groups.push(`
<div class="bc-group">
  <h2>파렛트 - ${esc(o.order_no)} <span class="tag tag--gray">${pallets.length}장</span></h2>
  <p class="sheet__desc" style="margin-bottom:10px">
    파렛트 개별 바코드입니다. 상차라벨 도입 전 방식이며 검수 화면에서 그대로 인식됩니다.
    (${esc(o.customer)})
  </p>
  <div class="bc-list">
    ${pallets.map((p) => card(p.barcode, p.scanned_at ? '검수완료' : '미검수')).join('')}
  </div>
</div>`);
}

// 유통가공 작업지시서의 문서번호 - 앱 「가공」 탭에서 스캔해 검수 화면을 연다
const jobs = (await db.listProcessJobs({})).filter((j) => j.doc_no);
if (jobs.length) {
    groups.push(`
<div class="bc-group">
  <h2>유통가공 문서번호 <span class="tag tag--gray">${jobs.length}건</span></h2>
  <p class="sheet__desc" style="margin-bottom:10px">
    작업지시서에 인쇄되는 바코드와 같습니다. 앱 <b>가공 탭 → 작업전 검수 · 완료 검수</b>에서
    스캔하면 그 작업의 사진 검수 화면이 열립니다.
  </p>
  <div class="bc-list">
    ${jobs.map((j) => card(j.doc_no, `${j.product_name} · ${j.status}`)).join('')}
  </div>
</div>`);
}

out.innerHTML = groups.join('');
</script>
</body>
</html>
